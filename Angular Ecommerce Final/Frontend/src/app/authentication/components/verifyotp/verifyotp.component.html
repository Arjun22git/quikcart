<div class="section">
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="card col-12 col-md-8 col-lg-7 p-4 shadow">
                <div class="card-body">
                    <h4 class="card-title text-center">OTP Verification</h4>
                    <h6 class="text-center">Please enter the OTP sent to your registered email. It is valid for 5 minutes.</h6>
                    <div class="card-text text-center mt-4">
                        <form class="otp-form" (ngSubmit)="verifyOtp()">
                            <div class="d-flex justify-content-center mb-4">
                                @for(num of value;track $index){
                                    <input class="otp-field" 
                                      
                                       type="text" 
                                       maxlength="1" 
                                       (input)="onOtpInput($index, $event)" 
                                       [(ngModel)]="value[$index]" 
                                       name="otp-field-{{$index}}"
                                       required>
                                        
                                }
                                
                            </div>
                            <input class="otp-value" type="hidden" [value]="otp">
                            <div class="d-block mt-4">
                                <button class="btn btn-primary w-100" type="submit">Verify</button>
                            </div>
                        </form>
                        <div class="mt-3">
                            <p class="text-muted">Didn't receive the OTP? <a href="#" >Resend OTP</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
