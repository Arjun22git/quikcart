<div class="filter-section p-3 bg-light border rounded">
  <h3 class="text-center mb-4">Filters</h3>

  <div class="filter-group mb-4">
      <h4><i class="bi bi-currency-rupee"></i> Price Range</h4>
      <input 
          type="range" 
          min="0" 
          max="10000" 
          step="100" 
          [(ngModel)]="priceRange" 
          (input)="updateFilters()" 
          class="form-range" 
      />
      <div class="price-range-labels text-center">
          <span>0</span>
          <span>{{ priceRange }}</span>
          <span>10000+</span>
      </div>
  </div>
  <div class="filter-group mb-4">
    <h4><i class="bi bi-tags"></i> Categories</h4>
      @for(category of categories;track $index){
        <div >
          <label class="form-check-label">
            <input 
                type="checkbox" 
                class="form-check-input" 
                [(ngModel)]="category.selected" 
                (change)="updateFilters()" 
            />
            {{ category.name }}
        </label>
          </div>

      }
     
    </div>
  </div>
