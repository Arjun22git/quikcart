<header class="py-5" style="background: url('https://d118ps6mg0w7om.cloudfront.net/media/boolfly/banner/fit-in/SLIDING-BANNERS-new-02.jpg?v=1232')">
    <div class="overlay">
        <div class="container d-flex justify-content-end px-4 px-lg-5 my-5">
            <div class="text-white text-end">
                <h1 class="display-4 fw-bolder">Shopping Festival is Here</h1>
                <p class="lead fw-normal text-white-50 mb-4">Check out top offers today!</p>
                <a routerLink="/products" class="btn btn-shop-now">Shop Now →</a>
            </div>
        </div>
    </div>
</header>

<!-- Carousel Section -->
<section class="py-5">
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://www.dennislingo.com/cdn/shop/files/DL_Website_Banner.jpg?v=1720438275&width=1789" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://d118ps6mg0w7om.cloudfront.net/media/wysiwyg/fit-in/1301x449/400050-D.jpg?v=234234235" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://www.dennislingo.com/cdn/shop/files/New_ariival__desktop.png?v=1723771740&width=1789" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://d118ps6mg0w7om.cloudfront.net/media/boolfly/banner/fit-in/SLIDING-BANNERS-new-02.jpg?v=1232" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</section>

<!-- Section-->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            @for(item of products;track $index){
                <div class="col mb-5">
                    <div class="card h-100">
                        <!-- Product badge -->
                        <span class="badge bg-danger">HOT</span> <!-- Example badge -->
                        <!-- Product image-->
                        <img class="card-img-top" src={{item.imageUrl}} />
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder">{{item.name}}</h5>
                                <!-- Product price-->
                                {{item.price | currency:'INR':'symbol':'1.2-2'}}
                            </div>
                        </div>
                        <!-- Product actions-->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center">
                                <a class="btn icon-button" href="#" title="Add to Wishlist">
                                    <i class="bi bi-heart"></i> <!-- Bootstrap icon for wishlist -->
                                </a>
                                <a class="btn icon-button" href="#" title="Add to Cart">
                                    <i class="bi bi-cart-plus"></i> <!-- Bootstrap icon for cart -->
                                </a>
                                <a class="btn btn-outline-dark mt-auto" >View More</a>
                            </div>
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</section>

<!-- Footer-->
<footer class="py-5 bg-dark">
    <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Qwikart 2024</p></div>
</footer>
