<div class="mt-3">
    <p class="text-muted mb-2">Quantity</p>
    <div class="input-group">
        <button class="btn btn-outline-secondary" type="button" (click)="decrement()">
            <i class="bi bi-dash-circle"></i>
        </button>
        <input type="number" class="form-control text-center" [value]="quantity" min="1" max="3" readonly aria-label="Quantity">
        <button class="btn btn-outline-secondary" type="button" (click)="increment()">
            <i class="bi bi-plus-circle"></i>
        </button>
    </div>
</div>
