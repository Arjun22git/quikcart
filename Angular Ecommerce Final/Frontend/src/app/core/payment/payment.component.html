<div class="container d-flex justify-content-center mt-5 mb-5">
    <div class="row g-3">
        <div class="col-md-6">  
            <span>Payment Method</span>
            <div class="card">
                <div class="card-header">
                    <strong>Payment Amount: {{ cartTotal | currency:'INR':'symbol':'1.2-2'}}</strong>
                </div>
                <div class="accordion" id="accordionExample">
                    <div class="card">
                        <div class="card-header p-0" id="headingTwo">
                            <h2 class="mb-0">
                                <button class="btn btn-light btn-block text-left collapsed p-3" type="button" (click)="toggleCollapse('upi')">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>UPI</span>
                                        <img src="assets/upi-icon.svg" width="30">
                                    </div>
                                </button>
                            </h2>
                        </div>
                        <div [ngClass]="{'collapse': !isUpiVisible, 'show': isUpiVisible}" aria-labelledby="headingTwo">
                            <div class="card-body">
                                <label for="upiID">UPI ID:</label>
                                <input type="text" id="upiID" class="form-control" placeholder="Enter your UPI ID"  [(ngModel)]="upiID">
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header p-0" id="headingOne">
                            <h2 class="mb-0">
                                <button class="btn btn-light btn-block text-left p-3" (click)="toggleCollapse('credit')">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>Credit Card</span>
                                        <div class="icons">
                                            <img src="https://i.imgur.com/2ISgYja.png" width="30">
                                            <img src="https://i.imgur.com/W1vtnOV.png" width="30">
                                            <img src="https://i.imgur.com/35tC99g.png" width="30">
                                        </div>
                                    </div>
                                </button>
                            </h2>
                        </div>
                        <div [ngClass]="{'collapse': !isCardVisible, 'show': isCardVisible}" aria-labelledby="headingOne">
                            <div class="card-body">
                                <input type="text" class="form-control mb-3" placeholder="Card Number"  [(ngModel)]="cardNumber">
                                <input type="text" class="form-control mb-3" placeholder="MM/YY" [(ngModel)]="expiryDate">
                                <input type="text" class="form-control mb-3" placeholder="CVC/CVV" [(ngModel)]="cvv">
                                <span class="text-muted"><i class="bi bi-lock"></i> Secure transaction</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <button class="btn btn-primary btn-block" (click)="pay()" [disabled]="!canPay()">Pay</button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <span>Contact Support</span>
            <div class="card p-3">
                <p>If you have any questions or need assistance, please reach out to our support team.</p>
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Your Email" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" placeholder="Your Message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Send Message</button>
                </form>
                <div class="text-center mt-3">
                    <small>Or call us at: <strong>(123) 456-7890</strong></small>
                </div>
            </div>
        </div>
    </div>
</div>
